name: CI - ASSURED Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No "cache: npm" on purpose: it fails when the repo has no
          # package-lock.json. Add a lockfile later if you want caching.

      # "npm ci" needs a package-lock.json; this repo has none yet,
      # so use "npm install", which works with or without a lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Logic tests
        run: npm test

      - name: Build
        run: npm run build
