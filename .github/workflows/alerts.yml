name: ASSURED alert scheduler

# Wakes the server every 5 minutes so overdue check-ins are alerted even when
# nobody has the app open. Needs two repository secrets (Settings → Secrets and
# variables → Actions): SITE_URL (e.g. https://your-app.vercel.app) and
# CRON_SECRET (same value as the CRON_SECRET env var on Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call alert endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets not set yet - skipping."
            exit 0
          fi
          curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/alerts"
